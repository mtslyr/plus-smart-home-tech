# Тестовая конфигурация: H2 вместо PostgreSQL.
spring:
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 1000
  datasource:
    url: jdbc:h2:mem:order_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        ignore-exceptions:
          - feign.FeignException$FeignClientException
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
