server:
  port: 0

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        configuration:
          default:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic

logging:
  level:
    ru.yandex.practicum.order.feign: DEBUG
