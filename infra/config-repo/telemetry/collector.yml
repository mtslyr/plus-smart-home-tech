grpc:
  server:
    port: 59091
spring:
  kafka:
    topic:
      hub-events: telemetry.hubs.v1
      sensor-events: telemetry.sensors.v1
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ru.yandex.practicum.telemetry.serialization.KafkaAvroSerializer
